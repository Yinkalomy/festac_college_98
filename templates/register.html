<!doctype html>
<html>
<head><title>Admin Register</title></head>
<body>
<h2>Register Admin</h2>
{% if require_code %}
<p>You must know the registration code to create an admin account.</p>
{% endif %}
<form method="post">
  Email: <input name="email" type="email" required><br>
  Password: <input name="password" type="password" required><br>
  {% if require_code %}
  Registration code: <input name="code" required><br>
  {% endif %}
  <button type="submit">Register</button>
</form>
</body>
</html>
