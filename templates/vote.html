<!doctype html>
<html>
<head><title>Vote</title></head>
<body>
<h2>Cast your vote</h2>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post">
  <label>Enter choice (candidate name or option):</label><br>
  <input name="choice" required><br><br>
  <button type="submit">Submit Vote</button>
</form>
</body>
</html>
