<!doctype html>
<html>
<head><title>Generate Tokens</title></head>
<body>
<h2>Generate Voting Tokens</h2>
<form method="post">
  <p>Paste one email per line (optional):</p>
  <textarea name="emails" rows="6" cols="50"></textarea><br>
  <p>Or generate N anonymous tokens:</p>
  <input name="count" type="number" min="0"><br><br>
  <button type="submit">Generate</button>
</form>
</body>
</html>
